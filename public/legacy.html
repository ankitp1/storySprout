<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>StorySprout (Legacy)</title>
  <!--
    Legacy player for very old browsers (e.g. iPad on iOS 9.3.5 / Mobile Safari 9)
    that cannot run the main React app. Deliberately written in ES5 with no CSS
    variables, no CSS grid, no fetch, and native <audio> controls so it works on
    a ~2016 Safari. Config (Drive folder + API key) arrives via ?k=&f= query.
  -->
  <style>
    * { -webkit-box-sizing: border-box; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #f4f6f9;
      color: #2d3436;
      -webkit-text-size-adjust: 100%;
    }
    .topbar {
      background: #ff6b6b;
      color: #fff;
      padding: 12px 16px;
      font-size: 20px;
      font-weight: bold;
      position: relative;
    }
    .topbar .back {
      display: none;
      position: absolute;
      left: 10px;
      top: 8px;
      background: rgba(255,255,255,0.25);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 15px;
      -webkit-appearance: none;
    }
    .topbar.has-back .title { padding-left: 70px; }
    .topbar .title { display: inline-block; }
    .wrap { padding: 12px; max-width: 1100px; margin: 0 auto; }
    .note { color: #888; font-size: 14px; padding: 8px 4px; }

    /* Continue-listening card */
    .continue {
      display: none; background: #fff; border: 1px solid #e2e8f0;
      border-left: 6px solid #ff6b6b; border-radius: 10px; padding: 10px;
      margin: 0 4px 12px; cursor: pointer; overflow: hidden;
    }
    .continue:after { content: ""; display: block; clear: both; }
    .continue .cont-cover {
      float: left; width: 56px; height: 56px; border-radius: 8px;
      background: #dfe6e9; overflow: hidden; margin-right: 12px; text-align: center;
    }
    .continue .cont-cover img { width: 56px; height: 56px; }
    .continue .cont-txt { overflow: hidden; }
    .continue .cont-k { color: #ff6b6b; font-size: 12px; font-weight: bold;
      text-transform: uppercase; letter-spacing: 0.5px; }
    .continue .cont-t { font-weight: bold; font-size: 16px; margin: 2px 0; }
    .continue .cont-s { color: #888; font-size: 13px; }
    .err { color: #c0392b; }

    /* Search / filter box */
    .searchrow { padding: 4px 4px 10px; }
    .search {
      width: 100%; -webkit-appearance: none; box-sizing: border-box;
      border: 1px solid #e2e8f0; border-radius: 22px; padding: 11px 16px;
      font-size: 16px; background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 14px center;
      padding-left: 42px;
    }

    /* Book grid via float/flex, NOT css grid */
    .books { font-size: 0; }
    .card {
      display: inline-block;
      vertical-align: top;
      width: 46%;
      margin: 2%;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      font-size: 14px;
      cursor: pointer;
    }
    .card:active { background: #f1f5f9; -webkit-transform: scale(0.97); transform: scale(0.97); }
    .cover {
      display: block;
      position: relative;
      width: 100%;
      height: 180px;
      background: #dfe6e9;
      text-align: center;
      overflow: hidden;
    }
    .cover img { width: 100%; height: 180px; }
    /* Progress / finished badges on covers */
    .badge {
      position: absolute; top: 6px; right: 6px; z-index: 2;
      background: rgba(255,107,107,0.95); color: #fff; font-weight: bold;
      font-size: 12px; border-radius: 12px; padding: 3px 8px;
    }
    .badge.done { background: rgba(34,153,84,0.95); }
    .pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(0,0,0,0.12); z-index: 2; }
    .pbar i { display: block; height: 5px; background: #ff6b6b; }
    .pbar.done i { background: #229954; }
    .cover .ph {
      display: block;
      padding: 14px 8px;
      color: #636e72;
      font-weight: bold;
      line-height: 1.3;
    }
    .card .label { padding: 8px; font-weight: bold; }
    .card .series { color: #888; font-weight: normal; font-size: 12px; }

    /* Detail view */
    .detail { display: none; }
    .detail:after { content: ""; display: block; clear: both; }
    .player-col, .chapters-col { width: 100%; }
    .detail .hero { text-align: center; padding: 8px 0 4px; }
    .detail .hero img, .detail .hero .ph2 {
      width: 150px; height: 200px; border-radius: 10px; display: inline-block;
      background: #dfe6e9; color: #636e72; font-weight: bold;
    }
    .detail .ph2 { line-height: 200px; }
    .detail h2 { text-align: center; margin: 8px 12px 0; }
    .detail .sub { text-align: center; color: #888; margin: 2px 0 10px; }
    /* Keep the native audio element around for playback but hide its
       cramped built-in controls (old iOS only shows a tiny play button). */
    audio { width: 1px; height: 1px; position: absolute; left: -9999px; }
    .nowplaying { font-weight: bold; padding: 4px 4px 10px; }

    /* Custom control bar (works on iOS 9 WebKit) */
    .seekrow { padding: 4px 4px 2px; }
    .seek { width: 100%; -webkit-appearance: none; appearance: none; height: 6px;
      border-radius: 4px; background: #dfe6e9; margin: 6px 0; }
    .seek::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
      border-radius: 50%; background: #ff6b6b; }
    .times { font-size: 12px; color: #888; }
    .times .cur { float: left; }
    .times .dur { float: right; }
    .times:after { content: ""; display: block; clear: both; }
    .controls { text-align: center; padding: 8px 0 14px; }
    .ctrl {
      -webkit-appearance: none; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 50%; width: 52px; height: 52px; margin: 0 6px;
      font-size: 20px; color: #2d3436; vertical-align: middle; padding: 0;
    }
    .ctrl.small { width: 44px; height: 44px; font-size: 14px; }
    .ctrl.play { width: 64px; height: 64px; background: #ff6b6b; color: #fff;
      border-color: #ff6b6b; font-size: 26px; }
    .ctrl[disabled] { opacity: 0.35; }
    .ctrl:active { -webkit-transform: scale(0.92); transform: scale(0.92); }
    .ctrl.play:active { background: #ee5a5a; }
    .chapter:active, .vlcbtn:active, .pill:active { background: #eef2f6; }

    /* Secondary controls: speed + sleep timer */
    .controls2 { text-align: center; padding: 0 0 12px; }
    .pill {
      -webkit-appearance: none; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 18px; padding: 8px 14px; margin: 0 5px; font-size: 14px;
      font-weight: bold; color: #2d3436; min-width: 92px;
    }
    .pill.on { background: #ff6b6b; color: #fff; border-color: #ff6b6b; }

    /* Resume overlay when iOS suspends audio (lock / app switch) */
    .resume {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: #ff6b6b; color: #fff; text-align: center; padding: 16px;
      font-size: 17px; font-weight: bold; cursor: pointer;
      -webkit-box-shadow: 0 -2px 8px rgba(0,0,0,0.2); box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
    }
    .chrow { display: block; margin-bottom: 8px; font-size: 0; }
    .chapter {
      display: inline-block;
      vertical-align: middle;
      width: 78%;
      text-align: left;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px 0 0 8px;
      border-right: 0;
      padding: 12px 14px;
      font-size: 16px;
      -webkit-appearance: none;
      color: #2d3436;
    }
    .chapter.active { background: #ff6b6b; color: #fff; border-color: #ff6b6b; }
    .vlcbtn {
      display: inline-block;
      vertical-align: middle;
      width: 22%;
      text-align: center;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 0 8px 8px 0;
      padding: 12px 4px;
      font-size: 13px;
      font-weight: bold;
      color: #e8590c;
      -webkit-appearance: none;
      height: 100%;
    }
    .vlcbtn.done { background: #e8590c; color: #fff; border-color: #e8590c; }
    /* Offline / download-to-VLC banner */
    .offline {
      background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px;
      padding: 10px 12px; margin: 4px 4px 14px; font-size: 13px; color: #7c4a12;
    }
    .offline .dlall {
      display: block; width: 100%; margin-top: 8px; -webkit-appearance: none;
      background: #e8590c; color: #fff; border: 0; border-radius: 8px;
      padding: 11px; font-size: 15px; font-weight: bold;
    }
    .offline .hint { display: none; margin-top: 8px; color: #9a6a2c; }
    .spin { text-align: center; padding: 30px; color: #888; }
    .retry {
      background: #ff6b6b; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 18px; font-size: 15px; -webkit-appearance: none; margin-top: 8px;
    }

    /* ===== Responsive: tablets / larger phones ===== */
    /* 3-up grid and taller covers once there's room (iPad portrait ~768px). */
    @media (min-width: 600px) {
      .topbar { font-size: 22px; padding: 14px 18px; }
      .card { width: 29.33%; margin: 2%; }
      .cover, .cover img { height: 220px; }
      .card .label { font-size: 15px; }
      .detail .hero img, .detail .hero .ph2 { width: 190px; height: 250px; }
      .detail .ph2 { line-height: 250px; }
      .ctrl { width: 58px; height: 58px; font-size: 22px; }
      .ctrl.small { width: 50px; height: 50px; }
      .ctrl.play { width: 72px; height: 72px; font-size: 30px; }
    }

    /* 4-up grid on wide screens (iPad landscape ~1024px). */
    @media (min-width: 900px) {
      .card { width: 21%; margin: 2%; }
      .cover, .cover img { height: 240px; }
    }

    /* Landscape on tablets: cover + controls on the left, chapters on the
       right so nothing needs scrolling past the player. */
    @media (min-width: 760px) and (orientation: landscape) {
      .player-col {
        float: left; width: 42%; padding-right: 20px;
        position: -webkit-sticky; position: sticky; top: 12px;
      }
      .chapters-col { float: left; width: 58%; }
      .detail h2 { margin-top: 4px; }
      .offline { margin-left: 0; margin-right: 0; }
    }
  </style>
</head>
<body>
  <div class="topbar" id="topbar">
    <button class="back" id="backBtn" type="button">&#8592; Library</button>
    <span class="title" id="topTitle">StorySprout</span>
  </div>

  <div class="wrap">
    <div class="note">Simplified player for older devices.</div>
    <div id="libraryView">
      <div class="continue" id="continueCard"></div>
      <div class="searchrow" id="searchRow" style="display:none">
        <input class="search" id="searchBox" type="search" placeholder="Search books&hellip;" autocomplete="off" autocorrect="off" autocapitalize="none">
      </div>
      <div class="spin" id="status">Loading your library&hellip;</div>
      <div class="books" id="books"></div>
    </div>
    <div class="detail" id="detailView"></div>
  </div>

  <div class="resume" id="resumeBar">&#9658; Tap to resume playback</div>

  <script>
  (function () {
    var API = 'https://www.googleapis.com/drive/v3/files';

    function qparam(name) {
      var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
      return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
    }

    var apiKey = qparam('k');
    var folderId = qparam('f');

    var statusEl = document.getElementById('status');
    var booksEl = document.getElementById('books');
    var libraryView = document.getElementById('libraryView');
    var detailView = document.getElementById('detailView');
    var topbar = document.getElementById('topbar');
    var backBtn = document.getElementById('backBtn');
    var topTitle = document.getElementById('topTitle');

    if (!apiKey || !folderId) {
      statusEl.className = 'spin err';
      statusEl.innerHTML = 'Library not configured. Please open StorySprout from the main link on this device.';
      return;
    }

    function mediaUrl(id) {
      return API + '/' + id + '?alt=media&key=' + encodeURIComponent(apiKey) + '&acknowledgeAbuse=true';
    }

    // Natural sort so "Chapter 2" comes before "Chapter 10".
    function naturalCompare(a, b) {
      var ax = [], bx = [];
      a.replace(/(\d+)|(\D+)/g, function (_, n, s) { ax.push([n || Infinity, s || '']); });
      b.replace(/(\d+)|(\D+)/g, function (_, n, s) { bx.push([n || Infinity, s || '']); });
      while (ax.length && bx.length) {
        var an = ax.shift(), bn = bx.shift();
        var c = (an[0] - bn[0]) || (an[1] < bn[1] ? -1 : an[1] > bn[1] ? 1 : 0);
        if (c) return c;
      }
      return ax.length - bx.length;
    }

    function startsWith(s, p) { return s && s.lastIndexOf(p, 0) === 0; }

    function xhrJSON(url, ok, fail) {
      var x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.onreadystatechange = function () {
        if (x.readyState !== 4) return;
        if (x.status >= 200 && x.status < 300) {
          try { ok(JSON.parse(x.responseText)); }
          catch (e) { fail(e); }
        } else {
          fail(new Error('HTTP ' + x.status));
        }
      };
      x.onerror = function () { fail(new Error('network')); };
      x.send();
    }

    function listFolder(id, cb) {
      var q = "'" + id + "' in parents and (mimeType='application/vnd.google-apps.folder'"
            + " or mimeType contains 'audio/' or mimeType contains 'image/') and trashed=false";
      var url = API + '?q=' + encodeURIComponent(q)
              + '&key=' + encodeURIComponent(apiKey)
              + '&fields=' + encodeURIComponent('files(id,name,mimeType)')
              + '&orderBy=name';
      xhrJSON(url, function (data) {
        var files = data.files || [];
        var audio = [], images = [], folders = [];
        for (var i = 0; i < files.length; i++) {
          var f = files[i];
          if (startsWith(f.mimeType, 'audio/')) audio.push(f);
          else if (startsWith(f.mimeType, 'image/')) images.push(f);
          else if (f.mimeType === 'application/vnd.google-apps.folder') folders.push(f);
        }
        audio.sort(function (a, b) { return naturalCompare(a.name, b.name); });
        folders.sort(function (a, b) { return naturalCompare(a.name, b.name); });
        cb(null, { audio: audio, images: images, folders: folders });
      }, function (err) { cb(err); });
    }

    function buildBook(folder, contents, seriesName) {
      var chapters = [];
      for (var i = 0; i < contents.audio.length; i++) {
        chapters.push({ id: contents.audio[i].id, name: contents.audio[i].name, url: mediaUrl(contents.audio[i].id) });
      }
      return {
        id: folder.id,
        title: folder.name,
        series: seriesName || null,
        cover: contents.images.length ? mediaUrl(contents.images[0].id) : null,
        chapters: chapters
      };
    }

    var books = [];

    function loadLibrary() {
      listFolder(folderId, function (err, root) {
        if (err) { showError(); return; }
        var subs = root.folders;
        var i = 0;

        function nextRoot() {
          if (i >= subs.length) { renderLibrary(); return; }
          var item = subs[i];
          listFolder(item.id, function (err2, contents) {
            if (err2) { i++; nextRoot(); return; }
            if (contents.audio.length) {
              books.push(buildBook(item, contents, null));
              i++; nextRoot();
            } else if (contents.folders.length) {
              var seriesName = item.name;
              var seriesCover = contents.images.length ? mediaUrl(contents.images[0].id) : null;
              var subFolders = contents.folders;
              var j = 0;
              function nextSub() {
                if (j >= subFolders.length) { i++; nextRoot(); return; }
                var sb = subFolders[j];
                listFolder(sb.id, function (err3, sc) {
                  if (!err3 && sc.audio.length) {
                    var b = buildBook(sb, sc, seriesName);
                    if (!b.cover && seriesCover) b.cover = seriesCover;
                    books.push(b);
                  }
                  j++; nextSub();
                });
              }
              nextSub();
            } else {
              i++; nextRoot();
            }
          });
        }
        nextRoot();
      });
    }

    function showError() {
      statusEl.className = 'spin err';
      statusEl.innerHTML = 'Could not load the library. Please check the connection.'
        + '<br><button class="retry" type="button" id="retryBtn">Try again</button>';
      var rb = document.getElementById('retryBtn');
      if (rb) rb.onclick = function () {
        statusEl.className = 'spin';
        statusEl.innerHTML = 'Loading your library&hellip;';
        books = [];
        loadLibrary();
      };
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Fraction (0..1) of a book completed, plus a "finished" flag.
    function bookProgress(b) {
      if (isFinished(b.id)) return 1;
      var prog = loadProgress()[b.id];
      var total = b.chapters.length || 1;
      if (!prog || typeof prog.c !== 'number') return 0;
      // Count completed chapters as whole units; the current one is partial.
      return Math.min(1, prog.c / total);
    }

    function coverInner(b) {
      var pct = Math.round(bookProgress(b) * 100);
      var done = isFinished(b.id);
      var badge = '';
      if (done) badge = '<span class="badge done">&#10003; Done</span>';
      else if (pct > 0) badge = '<span class="badge">' + pct + '%</span>';
      var bar = (pct > 0)
        ? '<span class="pbar' + (done ? ' done' : '') + '"><i style="width:' + pct + '%"></i></span>'
        : '';
      var inner = b.cover
        ? '<img alt="" data-src="' + b.cover + '">'
        : '<span class="ph">' + esc(b.title) + '</span>';
      return badge + inner + bar;
    }

    function renderLibrary() {
      if (!books.length) {
        statusEl.innerHTML = 'No books found yet. Ask a grown-up to add some.';
        return;
      }
      statusEl.style.display = 'none';
      var sr = document.getElementById('searchRow');
      if (sr && books.length > 4) sr.style.display = 'block';
      var html = '';
      for (var i = 0; i < books.length; i++) {
        var b = books[i];
        var series = b.series ? '<div class="series">' + esc(b.series) + '</div>' : '';
        var hay = (b.title + ' ' + (b.series || '')).toLowerCase();
        html += '<div class="card" data-i="' + i + '" data-hay="' + esc(hay) + '">'
              + '<span class="cover">' + coverInner(b) + '</span>'
              + '<div class="label">' + esc(b.title) + series + '</div></div>';
      }
      booksEl.innerHTML = html;
      var cards = booksEl.getElementsByClassName('card');
      for (var c = 0; c < cards.length; c++) {
        cards[c].onclick = function () { openBook(parseInt(this.getAttribute('data-i'), 10)); };
      }
      lazyLoadCovers();
      renderContinue();
    }

    // ---- Lazy-load cover images (no IntersectionObserver on iOS 9) ----
    function lazyLoadCovers() {
      var imgs = booksEl.getElementsByTagName('img');
      var vh = window.innerHeight || document.documentElement.clientHeight;
      for (var i = 0; i < imgs.length; i++) {
        var img = imgs[i];
        if (img.getAttribute('data-src') && img.parentNode.offsetParent !== null) {
          var rect = img.getBoundingClientRect();
          if (rect.top < vh + 300 && rect.bottom > -300) {
            img.src = img.getAttribute('data-src');
            img.removeAttribute('data-src');
          }
        }
      }
    }
    var lazyTick = null;
    function scheduleLazy() {
      if (lazyTick) return;
      lazyTick = setTimeout(function () { lazyTick = null; lazyLoadCovers(); }, 150);
    }
    window.addEventListener('scroll', scheduleLazy);
    window.addEventListener('resize', scheduleLazy);

    // ---- Search / filter ----
    function applyFilter(q) {
      q = (q || '').toLowerCase().replace(/^\s+|\s+$/g, '');
      var cards = booksEl.getElementsByClassName('card');
      for (var i = 0; i < cards.length; i++) {
        var hay = cards[i].getAttribute('data-hay') || '';
        cards[i].style.display = (!q || hay.indexOf(q) !== -1) ? 'inline-block' : 'none';
      }
      lazyLoadCovers();
    }

    function bookIndexById(id) {
      for (var i = 0; i < books.length; i++) { if (books[i].id === id) return i; }
      return -1;
    }

    function renderContinue() {
      var card = document.getElementById('continueCard');
      if (!card) return;
      var lastId = getLastBook();
      var idx = lastId ? bookIndexById(lastId) : -1;
      if (idx < 0) { card.style.display = 'none'; return; }
      var b = books[idx];
      var prog = loadProgress()[b.id];
      var chIdx = (prog && typeof prog.c === 'number') ? prog.c : 0;
      var chName = (b.chapters[chIdx] && b.chapters[chIdx].name) || '';
      var cover = b.cover
        ? '<span class="cont-cover"><img src="' + b.cover + '" alt=""></span>'
        : '<span class="cont-cover"></span>';
      card.innerHTML = cover
        + '<div class="cont-txt">'
        +   '<div class="cont-k">&#9658; Continue listening</div>'
        +   '<div class="cont-t">' + esc(b.title) + '</div>'
        +   '<div class="cont-s">' + esc(chName) + '</div>'
        + '</div>';
      card.style.display = 'block';
      card.onclick = function () { openBook(idx); };
    }

    // ---- Progress persistence ----
    function loadProgress() {
      try { return JSON.parse(localStorage.getItem('ss_legacy_progress') || '{}'); }
      catch (e) { return {}; }
    }
    function saveProgress(bookId, chapterIndex, time) {
      try {
        var p = loadProgress();
        p[bookId] = { c: chapterIndex, t: time };
        localStorage.setItem('ss_legacy_progress', JSON.stringify(p));
      } catch (e) {}
    }

    // ---- Finished books ----
    function loadFinished() {
      try { return JSON.parse(localStorage.getItem('ss_legacy_finished') || '{}'); }
      catch (e) { return {}; }
    }
    function setFinished(bookId, val) {
      try {
        var f = loadFinished();
        if (val) f[bookId] = 1; else delete f[bookId];
        localStorage.setItem('ss_legacy_finished', JSON.stringify(f));
      } catch (e) {}
    }
    function isFinished(bookId) { return !!loadFinished()[bookId]; }

    // ---- Last-opened book (for the continue-listening card) ----
    function setLastBook(bookId) {
      try { localStorage.setItem('ss_legacy_last', bookId); } catch (e) {}
    }
    function getLastBook() {
      try { return localStorage.getItem('ss_legacy_last'); } catch (e) { return null; }
    }

    // ---- "Sent to VLC" memory ----
    function loadVlc() {
      try { return JSON.parse(localStorage.getItem('ss_legacy_vlc') || '{}'); }
      catch (e) { return {}; }
    }
    function markVlc(bookId, chapterIndex) {
      try {
        var v = loadVlc();
        if (!v[bookId]) v[bookId] = {};
        v[bookId][chapterIndex] = 1;
        localStorage.setItem('ss_legacy_vlc', JSON.stringify(v));
      } catch (e) {}
    }
    function isVlcDone(bookId, chapterIndex) {
      var v = loadVlc();
      return !!(v[bookId] && v[bookId][chapterIndex]);
    }

    // ---- Playback speed ----
    var SPEEDS = [1, 1.25, 1.5, 0.75];
    function getSpeed() {
      try {
        var s = parseFloat(localStorage.getItem('ss_legacy_speed'));
        return (s && s > 0) ? s : 1;
      } catch (e) { return 1; }
    }
    function setSpeed(s) {
      try { localStorage.setItem('ss_legacy_speed', String(s)); } catch (e) {}
    }

    // ---- Detail / player view ----
    var current = null;     // current book
    var currentChapter = 0;
    var audioEl = null;
    var lastSaved = 0;
    var wantPlaying = false; // user's intent, used to recover after iOS suspends audio

    function openBook(index) {
      current = books[index];
      setLastBook(current.id);
      currentChapter = 0;
      var saved = loadProgress()[current.id];
      var resumeTime = 0;
      if (saved && typeof saved.c === 'number' && saved.c < current.chapters.length) {
        currentChapter = saved.c;
        resumeTime = saved.t || 0;
      }

      libraryView.style.display = 'none';
      detailView.style.display = 'block';
      topbar.className = 'topbar has-back';
      backBtn.style.display = 'inline-block';
      topTitle.innerHTML = esc(current.title);

      var heroImg = current.cover
        ? '<img src="' + current.cover + '" alt="">'
        : '<span class="ph2">' + esc(current.title) + '</span>';
      var html = '<div class="player-col">'
        + '<div class="hero">' + heroImg + '</div>'
        + '<h2>' + esc(current.title) + '</h2>'
        + (current.series ? '<div class="sub">' + esc(current.series) + '</div>' : '')
        + '<div class="nowplaying" id="nowPlaying"></div>'
        + '<audio id="player" preload="metadata"></audio>'
        + '<div class="seekrow">'
        +   '<input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1">'
        +   '<div class="times"><span class="cur" id="curTime">0:00</span>'
        +     '<span class="dur" id="durTime">0:00</span></div>'
        + '</div>'
        + '<div class="controls">'
        +   '<button class="ctrl small" id="prevBtn" type="button" title="Previous chapter">&#9198;</button>'
        +   '<button class="ctrl" id="backBtn15" type="button" title="Back 15s">&#8630;15</button>'
        +   '<button class="ctrl play" id="playBtn" type="button">&#9658;</button>'
        +   '<button class="ctrl" id="fwdBtn15" type="button" title="Forward 15s">15&#8631;</button>'
        +   '<button class="ctrl small" id="nextBtn" type="button" title="Next chapter">&#9197;</button>'
        + '</div>'
        + '<div class="controls2">'
        +   '<button class="pill" id="speedBtn" type="button">Speed 1&times;</button>'
        +   '<button class="pill" id="sleepBtn" type="button">&#127769; Sleep</button>'
        + '</div>'
        + '</div>'
        + '<div class="chapters-col">'
        + '<div class="offline">'
        +   '📶 Listening offline? Download chapters into the VLC app to play them with no connection.'
        +   '<button class="dlall" id="dlAllBtn" type="button">&#8681; Send whole book to VLC</button>'
        +   '<div class="hint" id="vlcHint">If nothing happened, install the free <b>VLC</b> app from the App Store, then tap again.</div>'
        + '</div>'
        + '<div id="chapterList"></div>'
        + '</div>';
      detailView.innerHTML = html;

      audioEl = document.getElementById('player');
      renderChapters();
      wireControls();
      wireDownloads();

      audioEl.addEventListener('timeupdate', function () {
        updateSeek();
        var now = (new Date()).getTime();
        if (now - lastSaved > 3000) {
          lastSaved = now;
          saveProgress(current.id, currentChapter, audioEl.currentTime);
        }
      });
      audioEl.addEventListener('loadedmetadata', updateSeek);
      audioEl.addEventListener('durationchange', updateSeek);
      audioEl.addEventListener('play', function () { wantPlaying = true; hideResume(); updatePlayIcon(); });
      audioEl.addEventListener('pause', updatePlayIcon);
      audioEl.addEventListener('ended', function () {
        if (currentChapter < current.chapters.length - 1) {
          playChapter(currentChapter + 1, true);
        } else {
          // Reached the end of the last chapter: mark the book finished.
          wantPlaying = false;
          setFinished(current.id, true);
          updatePlayIcon();
        }
      });

      playChapter(currentChapter, false, resumeTime);
    }

    function fmtTime(s) {
      if (!s || s < 0 || isNaN(s) || s === Infinity) return '0:00';
      s = Math.floor(s);
      var m = Math.floor(s / 60), sec = s % 60;
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    var seeking = false;

    function updateSeek() {
      if (seeking || !audioEl) return;
      var seek = document.getElementById('seek');
      var cur = document.getElementById('curTime');
      var dur = document.getElementById('durTime');
      if (!seek) return;
      var d = audioEl.duration;
      if (d && d !== Infinity && !isNaN(d)) {
        seek.value = Math.round((audioEl.currentTime / d) * 1000);
        if (dur) dur.innerHTML = fmtTime(d);
      }
      if (cur) cur.innerHTML = fmtTime(audioEl.currentTime);
    }

    function updatePlayIcon() {
      var btn = document.getElementById('playBtn');
      if (!btn || !audioEl) return;
      btn.innerHTML = audioEl.paused ? '&#9658;' : '&#10073;&#10073;';
    }

    function updateNavButtons() {
      var prev = document.getElementById('prevBtn');
      var next = document.getElementById('nextBtn');
      if (prev) prev.disabled = (currentChapter <= 0);
      if (next) next.disabled = (currentChapter >= current.chapters.length - 1);
    }

    function wireControls() {
      var seek = document.getElementById('seek');
      document.getElementById('playBtn').onclick = function () {
        if (!audioEl) return;
        if (audioEl.paused) { wantPlaying = true; hideResume(); try { audioEl.play(); } catch (e) {} }
        else { wantPlaying = false; audioEl.pause(); }
      };
      document.getElementById('backBtn15').onclick = function () {
        if (audioEl) audioEl.currentTime = Math.max(0, audioEl.currentTime - 15);
      };
      document.getElementById('fwdBtn15').onclick = function () {
        if (audioEl && audioEl.duration) audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + 15);
      };
      document.getElementById('prevBtn').onclick = function () {
        if (currentChapter > 0) playChapter(currentChapter - 1, true);
      };
      document.getElementById('nextBtn').onclick = function () {
        if (currentChapter < current.chapters.length - 1) playChapter(currentChapter + 1, true);
      };
      seek.addEventListener('touchstart', function () { seeking = true; });
      seek.addEventListener('mousedown', function () { seeking = true; });
      function commitSeek() {
        if (audioEl && audioEl.duration && audioEl.duration !== Infinity) {
          audioEl.currentTime = (seek.value / 1000) * audioEl.duration;
        }
        seeking = false;
      }
      seek.addEventListener('change', commitSeek);
      seek.addEventListener('touchend', commitSeek);
      seek.addEventListener('mouseup', commitSeek);

      // Speed control
      var speedBtn = document.getElementById('speedBtn');
      updateSpeedLabel();
      speedBtn.onclick = function () {
        var cur = getSpeed();
        var idx = 0;
        for (var i = 0; i < SPEEDS.length; i++) { if (SPEEDS[i] === cur) { idx = i; break; } }
        var next = SPEEDS[(idx + 1) % SPEEDS.length];
        setSpeed(next);
        applySpeed();
        updateSpeedLabel();
      };

      // Sleep timer
      var sleepBtn = document.getElementById('sleepBtn');
      sleepBtn.onclick = function () { cycleSleep(); };
    }

    function applySpeed() {
      if (!audioEl) return;
      var s = getSpeed();
      try { audioEl.defaultPlaybackRate = s; audioEl.playbackRate = s; } catch (e) {}
    }
    function updateSpeedLabel() {
      var b = document.getElementById('speedBtn');
      if (!b) return;
      var s = getSpeed();
      var label = (s === 1) ? '1' : String(s);
      b.innerHTML = 'Speed ' + label + '×';
      if (s !== 1) b.className = 'pill on'; else b.className = 'pill';
    }

    // ---- Sleep timer ----
    var SLEEP_MINS = [0, 15, 30, 45, 60];
    var sleepTimer = null;
    var sleepEndsAt = 0;
    var sleepTick = null;

    function clearSleep() {
      if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
      if (sleepTick) { clearInterval(sleepTick); sleepTick = null; }
      sleepEndsAt = 0;
    }
    function cycleSleep() {
      var btn = document.getElementById('sleepBtn');
      if (!btn) return;
      // Figure out current selection from remaining minutes (0 if off).
      var curMin = sleepEndsAt ? Math.ceil((sleepEndsAt - (new Date()).getTime()) / 60000) : 0;
      var idx = 0;
      for (var i = 0; i < SLEEP_MINS.length; i++) { if (SLEEP_MINS[i] === curMin) { idx = i; break; } }
      var mins = SLEEP_MINS[(idx + 1) % SLEEP_MINS.length];
      clearSleep();
      if (mins === 0) {
        btn.className = 'pill';
        btn.innerHTML = '&#127769; Sleep';
        return;
      }
      sleepEndsAt = (new Date()).getTime() + mins * 60000;
      sleepTimer = setTimeout(function () {
        if (audioEl) { try { audioEl.pause(); } catch (e) {} }
        clearSleep();
        var b = document.getElementById('sleepBtn');
        if (b) { b.className = 'pill'; b.innerHTML = '&#127769; Sleep'; }
      }, mins * 60000);
      btn.className = 'pill on';
      updateSleepLabel();
      sleepTick = setInterval(updateSleepLabel, 30000);
    }
    function updateSleepLabel() {
      var btn = document.getElementById('sleepBtn');
      if (!btn || !sleepEndsAt) return;
      var left = Math.max(0, Math.ceil((sleepEndsAt - (new Date()).getTime()) / 60000));
      btn.innerHTML = '&#127769; ' + left + ' min';
    }

    function renderChapters() {
      var list = document.getElementById('chapterList');
      var html = '';
      for (var i = 0; i < current.chapters.length; i++) {
        var done = isVlcDone(current.id, i);
        html += '<div class="chrow">'
              + '<button class="chapter' + (i === currentChapter ? ' active' : '')
              +   '" type="button" data-i="' + i + '">' + esc(current.chapters[i].name) + '</button>'
              + '<button class="vlcbtn' + (done ? ' done' : '') + '" type="button" data-dl="' + i + '" '
              +   'title="Download to VLC">' + (done ? '&#10003; VLC' : '&#8681; VLC') + '</button>'
              + '</div>';
      }
      list.innerHTML = html;
      var btns = list.getElementsByClassName('chapter');
      for (var b = 0; b < btns.length; b++) {
        btns[b].onclick = function () { playChapter(parseInt(this.getAttribute('data-i'), 10), true); };
      }
      var dls = list.getElementsByClassName('vlcbtn');
      for (var d = 0; d < dls.length; d++) {
        dls[d].onclick = function () { sendToVlc(parseInt(this.getAttribute('data-dl'), 10)); };
      }
    }

    // ---- Download to VLC (offline) ----
    // VLC for iOS registers the vlc-x-callback scheme; its "download" action
    // pulls a remote file into VLC's offline library.
    function vlcDownloadUrl(mediaUrl, fileName) {
      var u = 'vlc-x-callback://x-callback-url/download?url=' + encodeURIComponent(mediaUrl);
      if (fileName) u += '&filename=' + encodeURIComponent(fileName);
      return u;
    }

    function fireScheme(url) {
      // Navigating an iframe to the scheme avoids leaving the page if VLC
      // is absent; if installed, iOS hands off to it.
      var f = document.createElement('iframe');
      f.style.display = 'none';
      f.src = url;
      document.body.appendChild(f);
      setTimeout(function () { try { document.body.removeChild(f); } catch (e) {} }, 1500);
    }

    function chapterFileName(ch) {
      var name = ch.name || 'audio';
      if (!/\.[a-z0-9]{2,4}$/i.test(name)) name += '.mp3';
      return name;
    }

    function sendToVlc(index) {
      var ch = current.chapters[index];
      if (!ch) return;
      fireScheme(vlcDownloadUrl(ch.url, chapterFileName(ch)));
      markVlc(current.id, index);
      renderChapters();
      var hint = document.getElementById('vlcHint');
      if (hint) hint.style.display = 'block';
    }

    function wireDownloads() {
      var dlAll = document.getElementById('dlAllBtn');
      if (!dlAll) return;
      dlAll.onclick = function () {
        // Queue each chapter to VLC with a small stagger so the scheme
        // hand-offs don't collide.
        var hint = document.getElementById('vlcHint');
        if (hint) hint.style.display = 'block';
        var i = 0;
        function next() {
          if (i >= current.chapters.length) { renderChapters(); return; }
          var ch = current.chapters[i];
          fireScheme(vlcDownloadUrl(ch.url, chapterFileName(ch)));
          markVlc(current.id, i);
          i++;
          setTimeout(next, 1200);
        }
        next();
      };
    }

    function playChapter(index, autoplay, resumeTime) {
      currentChapter = index;
      var ch = current.chapters[index];
      document.getElementById('nowPlaying').innerHTML = 'Now playing: ' + esc(ch.name);
      audioEl.src = ch.url;

      if (resumeTime && resumeTime > 0) {
        var seekOnce = function () {
          try { audioEl.currentTime = Math.max(0, resumeTime - 3); } catch (e) {}
          audioEl.removeEventListener('loadedmetadata', seekOnce);
        };
        audioEl.addEventListener('loadedmetadata', seekOnce);
      }
      audioEl.load();
      applySpeed();
      if (autoplay) { wantPlaying = true; try { audioEl.play(); } catch (e) {} }
      renderChapters();
      updateNavButtons();
      updatePlayIcon();
      var cur = document.getElementById('curTime');
      var dur = document.getElementById('durTime');
      if (cur) cur.innerHTML = '0:00';
      if (dur) dur.innerHTML = '0:00';
      var seek = document.getElementById('seek');
      if (seek) seek.value = 0;
      saveProgress(current.id, currentChapter, resumeTime || 0);
    }

    backBtn.onclick = function () {
      wantPlaying = false;
      hideResume();
      clearSleep();
      if (audioEl) { try { audioEl.pause(); } catch (e) {} }
      detailView.style.display = 'none';
      detailView.innerHTML = '';
      audioEl = null;
      libraryView.style.display = 'block';
      topbar.className = 'topbar';
      backBtn.style.display = 'none';
      topTitle.innerHTML = 'StorySprout';
      renderLibrary(); // refresh progress badges for the book we just left
    };

    // ---- Recover from iOS suspending audio (screen lock / app switch) ----
    // iOS silently pauses HTML5 audio when Safari is backgrounded. When we come
    // back, try to resume; if the browser blocks autoplay, show a tap-to-resume bar.
    var resumeBar = document.getElementById('resumeBar');
    function hideResume() { if (resumeBar) resumeBar.style.display = 'none'; }
    function showResume() { if (resumeBar) resumeBar.style.display = 'block'; }
    resumeBar.onclick = function () {
      hideResume();
      if (audioEl) { wantPlaying = true; try { audioEl.play(); } catch (e) {} }
    };
    function tryResume() {
      if (!audioEl || !wantPlaying || !audioEl.paused) { hideResume(); return; }
      try { audioEl.play(); } catch (e) {}
      // If still paused a moment later, the browser blocked it: offer a tap.
      setTimeout(function () {
        if (audioEl && wantPlaying && audioEl.paused) showResume();
        else hideResume();
      }, 350);
    }
    if (typeof document.addEventListener === 'function') {
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) tryResume();
      });
    }
    window.addEventListener('pageshow', tryResume);
    window.addEventListener('focus', tryResume);

    // Search box
    var searchBox = document.getElementById('searchBox');
    if (searchBox) {
      var onSearch = function () { applyFilter(searchBox.value); };
      searchBox.addEventListener('input', onSearch);
      searchBox.addEventListener('keyup', onSearch);
    }

    loadLibrary();
  })();
  </script>
</body>
</html>
